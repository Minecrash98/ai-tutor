<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>P4 元素检查演示</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="lesson-shell">
      <p class="eyebrow">CSS INSPECTOR LAB</p>

      <article class="demo-card" id="demo-card">
        <header class="card-header">
          <div>
            <span class="status-dot" aria-hidden="true"></span>
            <strong>独立教学卡片</strong>
          </div>
          <span class="badge">P4 READY</span>
        </header>

        <h1>点选我，观察盒模型</h1>
        <p class="card-copy">
          这段文字继承了卡片的颜色与行高。检查不同元素，可以看到直接命中与继承规则的区别。
        </p>

        <div class="feature-row">
          <span>padding</span>
          <span>flex gap</span>
          <span>position</span>
        </div>

        <section class="position-stage">
          <span>relative containing block</span>
          <b class="floating-note">absolute</b>
        </section>
      </article>
    </main>
  </body>
</html>
